{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "harness.name" . }}
  labels: {{- include "harness.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "harness.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.fromNamespaces }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ . | quote }}}
        {{- end }}
      ports:
        - {port: http}
  egress: []  # the harness calls nothing
{{- end }}
