name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: The image builds and serves
        run: |
          docker build -q -t veromesh/test-harness:ci .
          docker run -d --name harness -p 8100:8100 veromesh/test-harness:ci serve --people 500
          for _ in $(seq 30); do curl -fs localhost:8100/harness/status && break; sleep 1; done
          curl -fs localhost:8100/harness/status
  guides:
    # The Word copies of the administrator and user guides, built from docs/guides/*.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -q pandoc && pip install -q python-docx
      - run: python scripts/guides/build_docx.py
      - uses: actions/upload-artifact@v4
        with:
          name: guides
          path: |
            .build/guides/admin-guide.docx
            .build/guides/user-guide.docx
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render
        run: |
          helm lint deploy/helm/veromesh-test-harness
          helm template t deploy/helm/veromesh-test-harness > /tmp/default.yaml
          helm template t deploy/helm/veromesh-test-harness \
            --set company.difficulty=0 --set 'company.systems={entra,workday}' --set company.quirks.name-variant=0.9 \
            --set 'networkPolicy.fromNamespaces={veromesh}' > /tmp/custom.yaml
          grep -q -- '--systems=entra,workday' /tmp/custom.yaml
          grep -q -- '--quirk=name-variant=0.9' /tmp/custom.yaml
          grep -q 'kubernetes.io/metadata.name: "veromesh"' /tmp/custom.yaml
          ! grep -q -- '--systems' /tmp/default.yaml
