[project]
name = "veromesh-test-harness"
version = "0.1.0"
description = "A simulated company and its source systems, for testing VeroMesh end to end"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "rdflib>=7", "openpyxl>=3.1", "mcp>=1.20,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501", "S311"]  # S311: the simulation is seeded on purpose

[tool.ruff.lint.isort]
known-first-party = ["harness"]

[tool.setuptools.package-data]
harness = ["formats/*.json"]
